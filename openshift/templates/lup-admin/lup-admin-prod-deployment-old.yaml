kind: DeploymentConfig
apiVersion: apps.openshift.io/v1
metadata:
  name: landuseplanning-admin-prod
  namespace: e8b9ad-prod
  labels:
    app: landuseplanning-admin-prod
    app.kubernetes.io/component: landuseplanning-admin-prod
    app.kubernetes.io/instance: landuseplanning-admin-prod
    app.kubernetes.io/part-of: landuseplanning-admin-prod
spec:
  strategy:
    type: Rolling
    rollingParams:
      updatePeriodSeconds: 1
      intervalSeconds: 1
      timeoutSeconds: 600
      maxUnavailable: 25%
      maxSurge: 25%
    resources: {}
    activeDeadlineSeconds: 21600
  triggers:
    - type: ImageChange
      imageChangeParams:
        automatic: true
        containerNames:
          - landuseplanning-admin-prod
        from:
          kind: ImageStreamTag
          namespace: e8b9ad-tools
          name: 'lup-admin-deploy-image:prod'
        lastTriggeredImage: 'image-registry.openshift-image-registry.svc:5000/e8b9ad-tools/lup-admin-deploy-image@sha256:bff5d7493974e6f3bf8dc920860ab7a8bae0e5c323c5205797218ce8b048f3d6'
    - type: ConfigChange
  replicas: 3
  revisionHistoryLimit: 10
  test: false
  selector:
    app: landuseplanning-admin-prod
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: landuseplanning-admin-prod
    spec:
      containers:
        - name: landuseplanning-admin-prod
          image: 'image-registry.openshift-image-registry.svc:5000/e8b9ad-tools/lup-admin-deploy-image@sha256:bff5d7493974e6f3bf8dc920860ab7a8bae0e5c323c5205797218ce8b048f3d6'
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: REMOTE_API_PATH
              value: 'https://www.planninginpartnership.ca/api'
            - name: REMOTE_PUBLIC_PATH
              value: 'https://www.planninginpartnership.ca/'
            - name: DEPLOYMENT_ENVIRONMENT
              value: prod
            - name: API_URL
              value: 'https://www.planninginpartnership.ca/api'
          resources: {}
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          imagePullPolicy: Always
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      securityContext: {}
      schedulerName: default-scheduler
