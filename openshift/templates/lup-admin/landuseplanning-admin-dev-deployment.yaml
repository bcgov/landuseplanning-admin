kind: Deployment
apiVersion: apps/v1
metadata:
  name: landuseplanning-admin-dev
  namespace: e8b9ad-dev
  labels:
    app: landuseplanning-admin-dev
    app.kubernetes.io/component: landuseplanning-admin-dev
    app.kubernetes.io/instance: landuseplanning-admin-dev
    app.kubernetes.io/part-of: landuseplanning-admin-dev
spec:
  strategy:
    type: RollingUpdate
  replicas: 2
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: landuseplanning-admin-dev
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: landuseplanning-admin-dev
    spec:
      containers:
        - name: landuseplanning-admin-dev
          image: image-registry.apps.silver.devops.gov.bc.ca/e8b9ad-tools/lup-admin-deploy-image
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: REMOTE_API_PATH
              value: 'https://landuseplanning-dev.apps.silver.devops.gov.bc.ca/api'
            - name: REMOTE_PUBLIC_PATH
              value: 'https://landuseplanning-dev.apps.silver.devops.gov.bc.ca/'
            - name: DEPLOYMENT_ENVIRONMENT
              value: dev
            - name: API_URL
              value: 'https://landuseplanning-dev.apps.silver.devops.gov.bc.ca/api'
          resources: {}
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          imagePullPolicy: Always
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      securityContext: {}
      schedulerName: default-scheduler
      