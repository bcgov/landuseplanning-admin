<div class="spinner-container" *ngIf="loading">
  <div class="spinner-new rotating"></div>
</div>

<section id="header-section">
  <div class="result-num">
    <br>
    Displaying <strong>{{tableParams.totalListItems >= tableParams.pageSize ? tableParams.pageSize : tableParams.totalListItems }} of {{tableParams.totalListItems}}</strong> Survey Responses
  </div>
</section>

<section id="table-section">
  <div *ngIf="tableParams.totalListItems > 0 && !loading">
    <app-table-template [columns]="surveyResponseTableColumns" [data]="surveyResponseTableData" (onColumnSort)='setColumnSort($event)'
      (onPageNumUpdate)='getPaginatedComments($event)'>
    </app-table-template>
  </div>
  <div *ngIf="tableParams.totalListItems == 0">
    There are no survey responses.
  </div>
</section>
